<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Test Direct API Mistral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .response-box.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .response-content {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .error {
            background: #fee;
            border-left-color: #f44336;
        }

        .error h3 {
            color: #f44336;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #1976d2;
            margin: 5px 0;
            font-size: 14px;
        }

        .model-select {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .model-option {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-option:hover {
            border-color: #667eea;
        }

        .model-option.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Direct API Mistral</h1>
        <p class="subtitle">Testez l'API Mistral directement depuis votre navigateur</p>

        <div class="info-box">
            <p><strong>⚠️ Important :</strong> Entrez votre clé API Mistral ci-dessous</p>
            <p>🔑 Obtenez votre clé sur : <a href="https://console.mistral.ai/" target="_blank">console.mistral.ai</a></p>
        </div>

        <div class="input-group">
            <label for="apiKey">🔑 Clé API Mistral</label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="sk-..."
                value=""
            >
        </div>

        <div class="input-group">
            <label>🤖 Modèle</label>
            <div class="model-select">
                <div class="model-option" data-model="mistral-tiny">
                    <strong>Tiny</strong><br>
                    <small>Gratuit</small>
                </div>
                <div class="model-option" data-model="mistral-small">
                    <strong>Small</strong><br>
                    <small>Rapide</small>
                </div>
                <div class="model-option active" data-model="mistral-medium">
                    <strong>Medium</strong><br>
                    <small>Équilibré</small>
                </div>
                <div class="model-option" data-model="mistral-large">
                    <strong>Large</strong><br>
                    <small>Puissant</small>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="message">💬 Votre Message</label>
            <textarea 
                id="message" 
                placeholder="Écrivez votre message ici..."
            >Bonjour ! Peux-tu me parler de ZyatrIA Global ?</textarea>
        </div>

        <button class="btn" onclick="testAPI()">
            🚀 Tester l'API
        </button>

        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Envoi de la requête...</p>
        </div>

        <div class="response-box" id="responseBox">
            <h3>📝 Réponse</h3>
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>

    <script>
        let selectedModel = 'mistral-medium';

        // Gestion de la sélection du modèle
        document.querySelectorAll('.model-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.model-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                this.classList.add('active');
                selectedModel = this.dataset.model;
            });
        });

        async function testAPI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const message = document.getElementById('message').value.trim();
            const responseBox = document.getElementById('responseBox');
            const responseContent = document.getElementById('responseContent');
            const loading = document.querySelector('.loading');
            const btn = document.querySelector('.btn');

            // Validation
            if (!apiKey) {
                alert('⚠️ Veuillez entrer votre clé API Mistral');
                return;
            }

            if (!message) {
                alert('⚠️ Veuillez entrer un message');
                return;
            }

            // Afficher le loading
            loading.classList.add('show');
            responseBox.classList.remove('show');
            btn.disabled = true;

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: [
                            {
                                role: 'system',
                                content: 'Tu es un assistant IA pour ZyatrIA Global, une entreprise canadienne spécialisée en agents IA et automatisation. Sois courtois, professionnel et concis.'
                            },
                            {
                                role: 'user',
                                content: message
                            }
                        ],
                        temperature: 0.7
                    })
                });

                loading.classList.remove('show');

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `Erreur HTTP ${response.status}`);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;

                // Afficher la réponse
                responseBox.classList.remove('error');
                responseBox.classList.add('show');
                responseContent.textContent = assistantMessage;

            } catch (error) {
                loading.classList.remove('show');
                responseBox.classList.add('error', 'show');
                responseContent.textContent = `❌ Erreur : ${error.message}\n\n`;
                
                if (error.message.includes('401')) {
                    responseContent.textContent += '🔑 Vérifiez que votre clé API est correcte et valide.';
                } else if (error.message.includes('429')) {
                    responseContent.textContent += '⏱️ Limite de taux dépassée. Attendez quelques minutes.';
                } else if (error.message.includes('500')) {
                    responseContent.textContent += '🔧 Problème serveur Mistral. Réessayez plus tard.';
                }
            } finally {
                btn.disabled = false;
            }
        }

        // Permettre l'envoi avec Ctrl+Enter
        document.getElementById('message').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                testAPI();
            }
        });
    </script>
</body>
</html>
