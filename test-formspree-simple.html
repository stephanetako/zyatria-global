<!DOCTYPE html>
<html>
<head>
    <title>Test Formspree Simple</title>
</head>
<body>
    <h1>Test Formspree - Méthode HTML Pure</h1>
    
    <form action="https://formspree.io/f/xeelvrdl" method="POST">
        <label>Nom:
            <input type="text" name="name" required>
        </label><br><br>
        
        <label>Email:
            <input type="email" name="email" required>
        </label><br><br>
        
        <label>Téléphone:
            <input type="tel" name="phone" required>
        </label><br><br>
        
        <label>Entreprise:
            <input type="text" name="company" required>
        </label><br><br>
        
        <label>Service:
            <select name="service" required>
                <option value="">Sélectionnez...</option>
                <option value="agents-ia">Agents IA Intelligents</option>
                <option value="automation">Automatisation Avancée</option>
            </select>
        </label><br><br>
        
        <label>Budget:
            <select name="budget" required>
                <option value="">Sélectionnez...</option>
                <option value="starter">Starter (100$ - 500$/mois)</option>
                <option value="business">Business (500$ - 2000$/mois)</option>
            </select>
        </label><br><br>
        
        <label>Délai:
            <select name="timeline" required>
                <option value="">Sélectionnez...</option>
                <option value="asap">Dès que possible</option>
                <option value="1-month">Dans 1 mois</option>
            </select>
        </label><br><br>
        
        <label>Message:
            <textarea name="message" required></textarea>
        </label><br><br>
        
        <button type="submit">Envoyer</button>
    </form>
    
    <hr>
    <p><strong>Instructions:</strong></p>
    <ol>
        <li>Remplissez tous les champs</li>
        <li>Cliquez sur "Envoyer"</li>
        <li>Vous serez redirigé vers Formspree</li>
        <li>Si ça fonctionne, le problème vient de notre code React</li>
        <li>Si ça ne fonctionne pas, le problème vient de la config Formspree</li>
    </ol>
</body>
</html>
