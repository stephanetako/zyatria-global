<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#373D36"/>
  
  <!-- Orange gradient circle -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9A88F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="200" fill="url(#orangeGrad)"/>
  
  <!-- Letter Z in white -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Z</text>
  
  <!-- Small AI indicator -->
  <circle cx="380" cy="160" r="40" fill="#6366F1"/>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI</text>
</svg>
