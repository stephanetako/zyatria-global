<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F1EB"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="thumbgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#thumbgrad)"/>
  
  <!-- Main title area -->
  <rect x="60" y="80" width="1160" height="560" rx="30" fill="white" opacity="0.95"/>
  
  <!-- Title (customizable) -->
  <text x="640" y="240" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#373D36" text-anchor="middle">
    [TITRE VIDÉO]
  </text>
  
  <!-- Subtitle -->
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="48" fill="#666" text-anchor="middle">
    [Sous-titre ou description]
  </text>
  
  <!-- Icon/Emoji area -->
  <circle cx="640" cy="460" r="80" fill="#C98769"/>
  <text x="640" y="490" font-size="80" text-anchor="middle" fill="white">🤖</text>
  
  <!-- Brand strip -->
  <rect x="0" y="630" width="1280" height="90" fill="#C98769"/>
  <text x="60" y="690" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white">
    ZyatrIA Global
  </text>
  <text x="1220" y="690" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="end">
    🇨🇦
  </text>
  
  <!-- Corner accents -->
  <circle cx="100" cy="100" r="40" fill="#C98769" opacity="0.3"/>
  <circle cx="1180" cy="100" r="40" fill="#C98769" opacity="0.3"/>
</svg>