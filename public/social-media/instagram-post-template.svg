<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#F5F1EB"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="instagrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#C98769;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:0.15" />
    </linearGradient>
    <radialGradient id="instaglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#instagrad)"/>
  <circle cx="540" cy="540" r="400" fill="url(#instaglow)"/>
  
  <!-- Top brand -->
  <rect x="40" y="40" width="400" height="80" rx="40" fill="#C98769"/>
  <text x="240" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
    ZyatrIA Global
  </text>
  
  <!-- Main content area (customizable) -->
  <rect x="80" y="200" width="920" height="500" rx="20" fill="white" opacity="0.9"/>
  
  <!-- Title placeholder -->
  <text x="540" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#373D36" text-anchor="middle">
    [TITRE]
  </text>
  
  <!-- Content placeholder -->
  <text x="540" y="420" font-family="Arial, sans-serif" font-size="32" fill="#666" text-anchor="middle">
    [Contenu personnalisé]
  </text>
  
  <text x="540" y="480" font-family="Arial, sans-serif" font-size="32" fill="#666" text-anchor="middle">
    [Ligne 2]
  </text>
  
  <text x="540" y="540" font-family="Arial, sans-serif" font-size="32" fill="#666" text-anchor="middle">
    [Ligne 3]
  </text>
  
  <!-- CTA button -->
  <rect x="340" y="600" width="400" height="70" rx="35" fill="#C98769"/>
  <text x="540" y="645" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="white" text-anchor="middle">
    En savoir plus 👉
  </text>
  
  <!-- Bottom info -->
  <text x="540" y="820" font-family="Arial, sans-serif" font-size="28" fill="#C98769" text-anchor="middle" font-weight="600">
    🇨🇦 Entreprise Canadienne
  </text>
  
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="24" fill="#666" text-anchor="middle">
    IA sans frontières 🌍
  </text>
  
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    🤖 Agents IA • ⚡ Automatisation • 🚀 7-15 jours
  </text>
  
  <text x="540" y="1000" font-family="Arial, sans-serif" font-size="20" fill="#999" text-anchor="middle">
    zyatria.contact@gmail.com
  </text>
  
  <!-- Decorative corners -->
  <circle cx="100" cy="100" r="30" fill="#C98769" opacity="0.2"/>
  <circle cx="980" cy="100" r="30" fill="#C98769" opacity="0.2"/>
  <circle cx="100" cy="980" r="30" fill="#C98769" opacity="0.2"/>
  <circle cx="980" cy="980" r="30" fill="#C98769" opacity="0.2"/>
</svg>