<svg width="2560" height="1440" viewBox="0 0 2560 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="2560" height="1440" fill="#F5F1EB"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="ytgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:0.05" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#ytgrad)"/>
  
  <!-- Safe area guide (YouTube safe zone: center 1546x423) -->
  <!-- Main content centered -->
  <g transform="translate(1280, 720)">
    <!-- Central glow -->
    <circle cx="0" cy="0" r="600" fill="url(#glow)"/>
    
    <!-- Title -->
    <text x="0" y="-150" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#373D36" text-anchor="middle">
      ZyatrIA Global
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="60" font-weight="600" fill="#C98769" text-anchor="middle">
      IA sans frontières | AI without borders
    </text>
    
    <!-- Tagline -->
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="40" fill="#373D36" text-anchor="middle">
      Agents IA • Automatisation • Micro-agents spécialisés
    </text>
    
    <!-- Call to action -->
    <rect x="-250" y="80" width="500" height="80" rx="40" fill="#C98769"/>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">
      🚀 Déploiement en 7-15 jours
    </text>
    
    <!-- Bottom info -->
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="32" fill="#C98769" text-anchor="middle" font-weight="600">
      🇨🇦 Entreprise Canadienne | Québec
    </text>
  </g>
  
  <!-- Decorative elements - corners -->
  <!-- Top left -->
  <circle cx="200" cy="200" r="100" fill="#C98769" opacity="0.1"/>
  <circle cx="350" cy="150" r="60" fill="#C98769" opacity="0.15"/>
  
  <!-- Top right -->
  <circle cx="2360" cy="200" r="100" fill="#C98769" opacity="0.1"/>
  <circle cx="2210" cy="150" r="60" fill="#C98769" opacity="0.15"/>
  
  <!-- Bottom left -->
  <circle cx="200" cy="1240" r="100" fill="#C98769" opacity="0.1"/>
  <circle cx="350" cy="1290" r="60" fill="#C98769" opacity="0.15"/>
  
  <!-- Bottom right -->
  <circle cx="2360" cy="1240" r="100" fill="#C98769" opacity="0.1"/>
  <circle cx="2210" cy="1290" r="60" fill="#C98769" opacity="0.15"/>
  
  <!-- Icons floating -->
  <g opacity="0.3">
    <text x="400" y="400" font-size="80" fill="#C98769">🤖</text>
    <text x="2100" y="400" font-size="80" fill="#C98769">⚡</text>
    <text x="400" y="1100" font-size="80" fill="#C98769">🌍</text>
    <text x="2100" y="1100" font-size="80" fill="#C98769">💼</text>
  </g>
</svg>