<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradHome)"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Floating circles -->
  <circle cx="150" cy="100" r="60" fill="white" opacity="0.15"/>
  <circle cx="1050" cy="530" r="80" fill="white" opacity="0.15"/>
  <circle cx="900" cy="150" r="40" fill="#22D3EE" opacity="0.3"/>
  <circle cx="200" cy="500" r="50" fill="#22D3EE" opacity="0.25"/>
  
  <!-- Logo Icon -->
  <g transform="translate(550, 100)">
    <circle cx="50" cy="40" r="35" fill="white" opacity="0.3"/>
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Z</text>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="white" text-anchor="middle">
    ZyatrIA Global
  </text>
  
  <!-- Tagline -->
  <text x="600" y="295" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" opacity="0.95">
    Transform Your Business with AI
  </text>
  
  <!-- Key Features -->
  <g transform="translate(0, 350)">
    <text x="600" y="0" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">
      ⚡ Deploy in 7-15 Days
    </text>
    <text x="600" y="45" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">
      🌍 Available in 4 Languages
    </text>
    <text x="600" y="90" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">
      🤖 Specialized Micro-Agents
    </text>
  </g>
  
  <!-- Bottom badge -->
  <g transform="translate(450, 510)">
    <rect x="0" y="0" width="300" height="55" rx="27.5" fill="white" opacity="0.25"/>
    <text x="150" y="36" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="600">
      🇨🇦 Proudly Canadian
    </text>
  </g>
</svg>