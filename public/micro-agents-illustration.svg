<svg width="700" height="500" viewBox="0 0 700 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98769;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C98769;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central Hub -->
  <circle cx="350" cy="250" r="60" fill="url(#grad1)"/>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">AI</text>
  
  <!-- Micro-Agent 1: Real Estate -->
  <g transform="translate(150, 80)">
    <circle cx="0" cy="0" r="45" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">🏠</text>
    <rect x="-50" y="55" width="100" height="35" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#373D36" text-anchor="middle">Real Estate</text>
  </g>
  
  <!-- Micro-Agent 2: E-commerce -->
  <g transform="translate(550, 80)">
    <circle cx="0" cy="0" r="45" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">🛒</text>
    <rect x="-50" y="55" width="100" height="35" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#373D36" text-anchor="middle">E-commerce</text>
  </g>
  
  <!-- Micro-Agent 3: Customer Support -->
  <g transform="translate(150, 420)">
    <circle cx="0" cy="0" r="45" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">💬</text>
    <rect x="-50" y="55" width="100" height="35" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#373D36" text-anchor="middle">Support 24/7</text>
  </g>
  
  <!-- Micro-Agent 4: Lead Generation -->
  <g transform="translate(550, 420)">
    <circle cx="0" cy="0" r="45" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">🎯</text>
    <rect x="-50" y="55" width="100" height="35" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#373D36" text-anchor="middle">Lead Gen</text>
  </g>
  
  <!-- Micro-Agent 5: Appointment -->
  <g transform="translate(50, 250)">
    <circle cx="0" cy="0" r="40" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="35" text-anchor="middle">📅</text>
    <rect x="-45" y="50" width="90" height="30" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#373D36" text-anchor="middle">Scheduling</text>
  </g>
  
  <!-- Micro-Agent 6: Sales -->
  <g transform="translate(650, 250)">
    <circle cx="0" cy="0" r="40" fill="url(#grad2)" opacity="0.9"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="35" text-anchor="middle">💰</text>
    <rect x="-45" y="50" width="90" height="30" rx="5" fill="white" opacity="0.9"/>
    <text x="0" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#373D36" text-anchor="middle">Sales</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="350" y1="250" x2="150" y2="80" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="250" x2="550" y2="80" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="250" x2="150" y2="420" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="250" x2="550" y2="420" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="250" x2="50" y2="250" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="250" x2="650" y2="250" stroke="#C98769" stroke-width="2" opacity="0.3"/>
  
  <!-- Animated Particles -->
  <circle cx="250" cy="150" r="3" fill="#C98769">
    <animateMotion path="M 0 0 L 100 100" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="150" r="3" fill="#9333EA">
    <animateMotion path="M 0 0 L -100 100" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
