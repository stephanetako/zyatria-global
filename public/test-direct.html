<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Direct - Bouton Démo ZyatrIA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }

    h1 {
      color: #1f2937;
      margin-bottom: 12px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 16px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input::placeholder {
      color: #9ca3af;
    }

    #demo-button {
      width: 100%;
      padding: 14px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      font-family: inherit;
    }

    #demo-button:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    #demo-button:active {
      transform: translateY(0);
    }

    #demo-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status-message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .status-message.loading {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .required {
      color: #ef4444;
    }

    .info-box {
      background: #f0f9ff;
      border-left: 4px solid #3b82f6;
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 4px;
      text-align: left;
    }

    .info-box p {
      color: #1e40af;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .info-box strong {
      color: #1e3a8a;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .backend-url {
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      margin-top: 24px;
      font-size: 12px;
      color: #6b7280;
      word-break: break-all;
    }

    .backend-url strong {
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Test du Bouton Démo</h1>
    <p class="subtitle">Testez l'intégration backend en temps réel</p>

    <div class="info-box">
      <p><strong>✨ Test en direct</strong></p>
      <p>Ce formulaire appelle directement votre backend Cloudflare Pages. Remplissez les champs et cliquez sur le bouton pour tester.</p>
    </div>

    <form id="demo-form">
      <div class="form-group">
        <label for="demo-name">
          Nom complet <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="demo-name" 
          placeholder="Jean Dupont" 
          required
        >
      </div>

      <div class="form-group">
        <label for="demo-email">
          Email <span class="required">*</span>
        </label>
        <input 
          type="email" 
          id="demo-email" 
          placeholder="jean.dupont@example.com" 
          required
        >
      </div>

      <div class="form-group">
        <label for="demo-company">
          Entreprise (optionnel)
        </label>
        <input 
          type="text" 
          id="demo-company" 
          placeholder="Nom de votre entreprise"
        >
      </div>

      <button type="submit" id="demo-button">
        Demander une Démo
      </button>
    </form>

    <div id="status-message" class="status-message"></div>

    <div class="backend-url">
      <strong>Backend URL:</strong>
      https://5748f1fc.zyatria-global-cve.pages.dev
    </div>
  </div>

  <!-- Script d'intégration backend -->
  <script src="/backend-integration.js"></script>

  <!-- Script de gestion du formulaire -->
  <script>
    const form = document.getElementById('demo-form');
    const button = document.getElementById('demo-button');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Récupérer les valeurs
      const name = document.getElementById('demo-name').value.trim();
      const email = document.getElementById('demo-email').value.trim();
      const company = document.getElementById('demo-company').value.trim();

      // Validation
      if (!name || !email) {
        showMessage('Veuillez remplir tous les champs obligatoires', 'error');
        return;
      }

      // Validation email basique
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('Veuillez entrer une adresse email valide', 'error');
        return;
      }

      // Désactiver le bouton et afficher le chargement
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span>Envoi en cours...';
      showMessage('Envoi de votre demande...', 'loading');

      try {
        console.log('📤 Envoi de la demande:', { name, email, company });

        // Appeler l'API via la fonction requestDemo du script backend-integration.js
        const result = await requestDemo(email, name, { company });

        console.log('📥 Réponse reçue:', result);

        if (result.success) {
          showMessage(
            result.message || '✅ Demande envoyée avec succès ! Nous vous contacterons sous 24h.',
            'success'
          );
          
          // Réinitialiser le formulaire après succès
          form.reset();
          
          // Confetti ou animation de succès (optionnel)
          celebrateSuccess();
        } else {
          showMessage(
            '❌ ' + (result.error || 'Une erreur est survenue. Veuillez réessayer.'),
            'error'
          );
        }
      } catch (error) {
        console.error('❌ Erreur lors de l\'envoi:', error);
        showMessage(
          '❌ Erreur de connexion. Vérifiez votre connexion internet et réessayez.',
          'error'
        );
      } finally {
        // Réactiver le bouton
        button.disabled = false;
        button.innerHTML = 'Demander une Démo';
      }
    });

    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = 'status-message ' + type;
      statusMessage.style.display = 'block';

      // Faire défiler vers le message
      statusMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Masquer automatiquement après 5 secondes pour les messages de succès
      if (type === 'success') {
        setTimeout(() => {
          statusMessage.style.display = 'none';
        }, 5000);
      }
    }

    function celebrateSuccess() {
      // Animation simple de succès
      const container = document.querySelector('.container');
      container.style.transform = 'scale(1.02)';
      setTimeout(() => {
        container.style.transform = 'scale(1)';
      }, 200);
    }

    // Validation en temps réel
    document.getElementById('demo-email').addEventListener('blur', function() {
      const email = this.value.trim();
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        this.style.borderColor = '#ef4444';
      } else {
        this.style.borderColor = '#e5e7eb';
      }
    });

    // Log pour debug
    console.log('✅ Page de test chargée');
    console.log('📍 Backend URL:', 'https://5748f1fc.zyatria-global-cve.pages.dev');
    console.log('🔧 Fonction requestDemo disponible:', typeof requestDemo !== 'undefined');
  </script>
</body>
</html>
