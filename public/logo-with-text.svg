<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo simplifié à gauche -->
  <g transform="translate(5, 5)">
    <!-- Cercles -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="#6B46C1" stroke-width="1.5" opacity="0.3"/>
    <circle cx="25" cy="25" r="17" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Nœuds -->
    <circle cx="25" cy="8" r="2.5" fill="#6B46C1"/>
    <circle cx="38" cy="16" r="2.5" fill="#F97316"/>
    <circle cx="38" cy="34" r="2.5" fill="#6B46C1"/>
    <circle cx="25" cy="42" r="2.5" fill="#F97316"/>
    <circle cx="12" cy="34" r="2.5" fill="#6B46C1"/>
    <circle cx="12" cy="16" r="2.5" fill="#F97316"/>
    
    <!-- Centre -->
    <circle cx="25" cy="25" r="4" fill="url(#grad1)"/>
    
    <!-- Lignes -->
    <line x1="25" y1="25" x2="25" y2="8" stroke="#6B46C1" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="25" x2="38" y2="16" stroke="#F97316" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="25" x2="38" y2="34" stroke="#6B46C1" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="25" x2="25" y2="42" stroke="#F97316" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="25" x2="12" y2="34" stroke="#6B46C1" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="25" x2="12" y2="16" stroke="#F97316" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Texte ZyatrIA GLOBAL -->
  <text x="65" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <tspan fill="#6B46C1">Zyatr</tspan><tspan fill="#F97316">I</tspan><tspan fill="#6B46C1">A</tspan>
    <tspan fill="#6B7280" font-size="18" font-weight="normal"> GLOBAL</tspan>
  </text>
  
  <!-- Ligne d'accent -->
  <line x1="65" y1="42" x2="270" y2="42" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
</svg>
