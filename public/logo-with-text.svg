<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(5, 5)">
    <!-- Z Letter -->
    <path d="M 10 15 L 40 15 L 40 20 L 20 35 L 40 35 L 40 40 L 10 40 L 10 35 L 30 20 L 10 20 Z" 
          fill="url(#textGradient)"/>
    
    <!-- AI Dots -->
    <circle cx="38" cy="12" r="1.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="12" cy="43" r="1.5" fill="#06B6D4" opacity="0.8"/>
  </g>
  
  <!-- Text: ZyatrIA -->
  <text x="60" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#textGradient)">
    ZyatrIA
  </text>
  
  <!-- Text: GLOBAL -->
  <text x="155" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280">
    GLOBAL
  </text>
  
  <!-- Accent Line -->
  <rect x="60" y="45" width="120" height="2" rx="1" fill="url(#textGradient)" opacity="0.3"/>
</svg>