<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Symbole abstrait (réseau d'agents IA) -->
  <g transform="translate(50, 50)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#C98769" stroke-width="3" />
    <circle cx="50" cy="50" r="20" fill="none" stroke="#A86F53" stroke-width="2" />
    <line x1="50" y1="10" x2="50" y2="90" stroke="#C98769" stroke-width="2" />
    <line x1="10" y1="50" x2="90" y2="50" stroke="#C98769" stroke-width="2" />
    <line x1="20" y1="20" x2="80" y2="80" stroke="#C98769" stroke-width="1.5" />
    <line x1="80" y1="20" x2="20" y2="80" stroke="#C98769" stroke-width="1.5" />
    <!-- Points autour du symbole -->
    <circle cx="10" cy="10" r="5" fill="#C98769" />
    <circle cx="90" cy="10" r="5" fill="#C98769" />
    <circle cx="10" cy="90" r="5" fill="#C98769" />
    <circle cx="90" cy="90" r="5" fill="#C98769" />
    <circle cx="50" cy="10" r="5" fill="#A86F53" />
    <circle cx="50" cy="90" r="5" fill="#A86F53" />
    <circle cx="10" cy="50" r="5" fill="#A86F53" />
    <circle cx="90" cy="50" r="5" fill="#A86F53" />
  </g>

  <!-- Texte "ZyatrIA Global" -->
  <text x="150" y="100" font-family="'Instrument Sans', Arial, sans-serif" font-size="48" font-weight="bold" fill="#373D36">
    Zyatr
    <tspan fill="#C98769">I</tspan>
    <tspan fill="#A86F53">A</tspan>
  </text>
  <text x="150" y="140" font-family="'Instrument Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#373D36">GLOBAL</text>

  <!-- Baseline -->
  <text x="150" y="170" font-family="'Instrument Sans', Arial, sans-serif" font-size="14" fill="#373D36" opacity="0.7">
    Agents IA Intelligents pour les Entreprises Modernes
  </text>
</svg>
