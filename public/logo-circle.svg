<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle extérieur violet -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#6B46C1" stroke-width="2" opacity="0.3"/>
  
  <!-- Cercle intérieur orange -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#F97316" stroke-width="2" opacity="0.3"/>
  
  <!-- Nœuds du réseau -->
  <circle cx="100" cy="40" r="6" fill="#6B46C1"/>
  <circle cx="140" cy="70" r="6" fill="#F97316"/>
  <circle cx="140" cy="130" r="6" fill="#6B46C1"/>
  <circle cx="100" cy="160" r="6" fill="#F97316"/>
  <circle cx="60" cy="130" r="6" fill="#6B46C1"/>
  <circle cx="60" cy="70" r="6" fill="#F97316"/>
  
  <!-- Centre - nœud principal -->
  <circle cx="100" cy="100" r="8" fill="url(#grad1)"/>
  
  <!-- Lignes de connexion -->
  <line x1="100" y1="100" x2="100" y2="40" stroke="#6B46C1" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="140" y2="70" stroke="#F97316" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="140" y2="130" stroke="#6B46C1" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="100" y2="160" stroke="#F97316" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="60" y2="130" stroke="#6B46C1" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="60" y2="70" stroke="#F97316" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Texte ZyatrIA -->
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">
    <tspan fill="#6B46C1">Zyatr</tspan><tspan fill="#F97316">I</tspan><tspan fill="#6B46C1">A</tspan>
  </text>
  
  <!-- Texte Global -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6B7280">
    Global
  </text>
</svg>
