<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accentGrad)" opacity="0.4"/>
  <circle cx="1100" cy="530" r="100" fill="url(#accentGrad)" opacity="0.4"/>
  <circle cx="600" cy="315" r="200" fill="url(#accentGrad)" opacity="0.2"/>
  
  <!-- Logo/Icon -->
  <g transform="translate(500, 80)">
    <circle cx="100" cy="50" r="45" fill="white" opacity="0.2"/>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">Z</text>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    ZyatrIA Global
  </text>
  
  <!-- Slogan EN -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle" opacity="0.95">
    AI Without Borders
  </text>
  
  <!-- Slogan FR -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.85">
    L'IA Sans Frontières
  </text>
  
  <!-- Services -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">
    Agents IA • Automation • Micro-Agents
  </text>
  
  <!-- Canadian Badge -->
  <g transform="translate(460, 460)">
    <rect x="0" y="0" width="280" height="50" rx="25" fill="white" opacity="0.2"/>
    <text x="140" y="33" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">
      🇨🇦 Canadian Company
    </text>
  </g>
  
  <!-- Accent line -->
  <rect x="400" y="540" width="400" height="3" fill="#22D3EE" opacity="0.8"/>
</svg>