<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main Z Letter - Modern & Tech Style -->
  <path d="M 50 60 L 150 60 L 150 75 L 75 125 L 150 125 L 150 140 L 50 140 L 50 125 L 125 75 L 50 75 Z" 
        fill="url(#logoGradient)" 
        filter="url(#glow)"/>
  
  <!-- AI Circuit Pattern - Top Right -->
  <g opacity="0.8">
    <circle cx="140" cy="50" r="3" fill="#3B82F6"/>
    <circle cx="155" cy="45" r="2" fill="#8B5CF6"/>
    <circle cx="150" cy="60" r="2.5" fill="#06B6D4"/>
    <line x1="140" y1="50" x2="150" y2="60" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="140" y1="50" x2="155" y2="45" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- AI Circuit Pattern - Bottom Left -->
  <g opacity="0.8">
    <circle cx="60" cy="150" r="3" fill="#06B6D4"/>
    <circle cx="45" cy="155" r="2" fill="#3B82F6"/>
    <circle cx="50" cy="140" r="2.5" fill="#8B5CF6"/>
    <line x1="60" y1="150" x2="50" y2="140" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="150" x2="45" y2="155" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Neural Network Dots -->
  <g opacity="0.6">
    <circle cx="165" cy="100" r="2" fill="#8B5CF6"/>
    <circle cx="35" cy="100" r="2" fill="#3B82F6"/>
    <circle cx="100" cy="35" r="2" fill="#06B6D4"/>
    <circle cx="100" cy="165" r="2" fill="#8B5CF6"/>
  </g>
  
  <!-- Accent Line - Bottom -->
  <rect x="60" y="155" width="80" height="3" rx="1.5" fill="url(#accentGradient)" opacity="0.7"/>
</svg>