<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Background (optional, transparent by default) -->
  
  <!-- Icon - Stylized Z with circuit pattern -->
  <g transform="translate(5, 10)">
    <!-- Main Z shape -->
    <path d="M5 5 L35 5 L5 35 L35 35" stroke="#C98769" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Tech nodes -->
    <circle cx="5" cy="5" r="3" fill="#6366F1"/>
    <circle cx="35" cy="5" r="3" fill="#6366F1"/>
    <circle cx="5" cy="35" r="3" fill="#6366F1"/>
    <circle cx="35" cy="35" r="3" fill="#6366F1"/>
    <circle cx="20" cy="20" r="3" fill="#C98769"/>
  </g>
  
  <!-- Text: ZyatrIA -->
  <text x="55" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#373D36">
    ZyatrIA
