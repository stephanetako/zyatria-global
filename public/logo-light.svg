<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions for Light Backgrounds -->
  <defs>
    <linearGradient id="logoGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradientLight)" opacity="0.08"/>
  
  <!-- Main Z Letter - Modern & Tech Style -->
  <path d="M 50 60 L 150 60 L 150 75 L 75 125 L 150 125 L 150 140 L 50 140 L 50 125 L 125 75 L 50 75 Z" 
        fill="url(#logoGradientLight)" 
        filter="url(#glowLight)"/>
  
  <!-- AI Circuit Pattern - Top Right -->
  <g opacity="0.9">
    <circle cx="140" cy="50" r="3" fill="#2563EB"/>
    <circle cx="155" cy="45" r="2" fill="#7C3AED"/>
    <circle cx="150" cy="60" r="2.5" fill="#0891B2"/>
    <line x1="140" y1="50" x2="150" y2="60" stroke="#2563EB" stroke-width="1.5" opacity="0.7"/>
    <line x1="140" y1="50" x2="155" y2="45" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- AI Circuit Pattern - Bottom Left -->
  <g opacity="0.9">
    <circle cx="60" cy="150" r="3" fill="#0891B2"/>
    <circle cx="45" cy="155" r="2" fill="#2563EB"/>
    <circle cx="50" cy="140" r="2.5" fill="#7C3AED"/>
    <line x1="60" y1="150" x2="50" y2="140" stroke="#0891B2" stroke-width="1.5" opacity="0.7"/>
    <line x1="60" y1="150" x2="45" y2="155" stroke="#2563EB" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Neural Network Dots -->
  <g opacity="0.7">
    <circle cx="165" cy="100" r="2" fill="#7C3AED"/>
    <circle cx="35" cy="100" r="2" fill="#2563EB"/>
    <circle cx="100" cy="35" r="2" fill="#0891B2"/>
    <circle cx="100" cy="165" r="2" fill="#7C3AED"/>
  </g>
  
  <!-- Accent Line - Bottom -->
  <rect x="60" y="155" width="80" height="3" rx="1.5" fill="url(#accentGradientLight)" opacity="0.8"/>
</svg>