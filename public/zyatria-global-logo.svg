<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <!-- Symbole abstrait (réseau d'agents IA) -->
  <g transform="translate(10, 25)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#6B46C1" stroke-width="3" />
    <circle cx="50" cy="50" r="20" fill="none" stroke="#F97316" stroke-width="2" />
    <line x1="50" y1="10" x2="50" y2="90" stroke="#6B46C1" stroke-width="2" />
    <line x1="10" y1="50" x2="90" y2="50" stroke="#6B46C1" stroke-width="2" />
    <line x1="20" y1="20" x2="80" y2="80" stroke="#6B46C1" stroke-width="1.5" />
    <line x1="80" y1="20" x2="20" y2="80" stroke="#6B46C1" stroke-width="1.5" />
    <!-- Points autour du symbole -->
    <circle cx="10" cy="10" r="5" fill="#6B46C1" />
    <circle cx="90" cy="10" r="5" fill="#6B46C1" />
    <circle cx="10" cy="90" r="5" fill="#6B46C1" />
    <circle cx="90" cy="90" r="5" fill="#6B46C1" />
    <circle cx="50" cy="10" r="5" fill="#F97316" />
    <circle cx="50" cy="90" r="5" fill="#F97316" />
    <circle cx="10" cy="50" r="5" fill="#F97316" />
    <circle cx="90" cy="50" r="5" fill="#F97316" />
  </g>

  <!-- Texte "ZyatrIA Global" -->
  <text x="120" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1E293B">
    Zyatr
    <tspan fill="#F97316">I</tspan>
    <tspan fill="#6B46C1">A</tspan>
  </text>
  <text x="120" y="115" font-family="Arial, sans-serif" font-size="24" fill="#1E293B">GLOBAL</text>
</svg>