<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test API Demo - ZyatrIA Global</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .result pre {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.05);
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
    }

    .endpoint-info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .endpoint-info code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Test API Demo</h1>
    <p class="subtitle">ZyatrIA Global - Demande de démonstration</p>

    <div class="endpoint-info">
      <strong>Endpoint:</strong> <code>POST /api/demo</code><br>
      <strong>Status:</strong> <span id="status">En attente...</span>
    </div>

    <form id="demoForm">
      <div class="form-group">
        <label for="name">Nom complet *</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label for="company">Entreprise</label>
        <input type="text" id="company" name="company" placeholder="Acme Inc.">
      </div>

      <div class="form-group">
        <label for="phone">Téléphone</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Parlez-nous de votre projet..."></textarea>
      </div>

      <button type="submit" id="submitBtn">
        Demander une démo
      </button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script>
    const form = document.getElementById('demoForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');
    const statusSpan = document.getElementById('status');

    // Vérifier que l'API est accessible
    async function checkAPI() {
      try {
        const response = await fetch('/api/demo');
        if (response.ok) {
          statusSpan.textContent = '✅ API disponible';
          statusSpan.style.color = '#28a745';
        } else {
          statusSpan.textContent = '❌ API non disponible';
          statusSpan.style.color = '#dc3545';
        }
      } catch (error) {
        statusSpan.textContent = '❌ Erreur de connexion';
        statusSpan.style.color = '#dc3545';
      }
    }

    checkAPI();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Désactiver le bouton
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Envoi en cours<span class="loading"></span>';
      
      // Réinitialiser le résultat
      resultDiv.className = 'result';
      resultDiv.style.display = 'none';

      // Récupérer les données du formulaire
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        company: document.getElementById('company').value || undefined,
        phone: document.getElementById('phone').value || undefined,
        message: document.getElementById('message').value || undefined,
      };

      try {
        const response = await fetch('/api/demo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        });

        const result = await response.json();

        if (result.success) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <strong>✅ Succès !</strong><br>
            ${result.message}
            <pre>${JSON.stringify(result, null, 2)}</pre>
          `;
          form.reset();
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <strong>❌ Erreur</strong><br>
            ${result.message}
            <pre>${JSON.stringify(result, null, 2)}</pre>
          `;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <strong>❌ Erreur réseau</strong><br>
          ${error.message}
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Demander une démo';
      }
    });
  </script>
</body>
</html>
