<!DOCTYPE html>
<html>
<head>
    <title>Test Build Output</title>
</head>
<body>
    <h1>Vérification du build</h1>
    <pre id="output"></pre>
    <script>
        fetch('/index.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('output').textContent = 
                    html.substring(0, 1000) + '\n\n...\n\n' + 
                    'Taille totale: ' + html.length + ' caractères';
            });
    </script>
</body>
</html>
